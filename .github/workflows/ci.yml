name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older, now pointless runs.
# Runs on main always finish, so every commit there gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash runs with -e and pipefail, so any failing command fails the step.
# The Windows default (PowerShell) only checks the last command's exit code.
defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -q -r src scripts

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the latest one
          persist-credentials: false

      # The binary is checked against a hash written here, not against the
      # checksum file of the same release, so a swapped download fails.
      - name: Install gitleaks (version and SHA-256 pinned)
        working-directory: ${{ runner.temp }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --redact keeps any secret found out of the public CI log.
      - name: Secret scan (gitleaks, full history)
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      # On each OS, because code under `sys.platform == "win32"` is only
      # type-checked on that platform.
      - name: Type-check (mypy)
        run: mypy

      # Each OS runs code the other cannot (Windows ACLs, POSIX modes), so the
      # 80% floor is checked once, on the data of all four runs combined, in
      # the coverage job.
      - name: Tests with coverage (pytest)
        run: pytest -q --cov --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}-py${{ matrix.python }}

      - name: Keep the coverage data for the coverage job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: .coverage.${{ matrix.os }}-py${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      # relative_files (pyproject.toml) lets coverage match the Windows paths
      # (src\yunarpass\...) to the Linux ones.
      - name: Combine Windows and Linux coverage (at least 80%)
        run: |
          coverage combine
          coverage report

  # Follows the README's build-and-run block for the OS, line by line, on a
  # runner that has nothing but Python: no pip cache, no dev tools.
  readme-smoke:
    name: readme-smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"] # the oldest supported and the newest
        include:
          - os: ubuntu-latest
            readme: posix
          - os: windows-latest
            readme: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run the README install steps verbatim
        run: python scripts/readme_smoke.py "$README_BLOCK"
        env:
          README_BLOCK: ${{ matrix.readme }}

  # yunarpass.exe: one file with Python and every dependency inside, for
  # Windows users who have no Python. Built on every change, so a change that
  # breaks the build fails its pull request; the release job publishes the one
  # built for a v* tag.
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No pip cache: everything that goes into the .exe is downloaded fresh
      # and checked against the pinned hashes.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install (hash-checked, build tools included)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-build.txt
          pip install --no-deps --no-build-isolation .

      # --collect-data: the common-password list, which policy.py reads with
      # importlib.resources, so PyInstaller does not see it as an import.
      # --hidden-import: pywin32's C code imports win32timezone when it returns
      # a file time, which the data directory check reads.
      - name: Build yunarpass.exe (PyInstaller)
        run: >
          pyinstaller --onefile --console --name yunarpass
          --collect-data yunarpass --hidden-import win32timezone
          --noconfirm --clean src/yunarpass/__main__.py

      # With stdin closed the program starts, creates the owner-only data
      # directory (the pywin32 ACL code, inside the .exe) and exits 0 at the end
      # of input. Python prints CRLF line ends here, hence the tr.
      - name: Smoke-test the .exe
        env:
          YUNARPASS_HOME: ${{ runner.temp }}\yunarpass-home
        run: |
          version="$(dist/yunarpass.exe --version | tr -d '\r')"
          echo "$version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$version" = "yunarpass ${GITHUB_REF_NAME#v}"
          fi
          dist/yunarpass.exe < /dev/null
          test -d "$YUNARPASS_HOME"
          pyi-archive_viewer --list --brief dist/yunarpass.exe | grep -E 'yunarpass[\\/]data[\\/]common-passwords\.txt'
          sha256sum dist/yunarpass.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yunarpass-exe
          path: dist/yunarpass.exe
          if-no-files-found: error
          retention-days: 7

  # The one check that branch protection on main requires. Matrix entries
  # and new jobs can change without touching the protection rule; they
  # only need to be listed here.
  ci-ok:
    if: always()
    needs: [checks, secrets, tests, coverage, readme-smoke, exe]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          CHECKS: ${{ needs.checks.result }}
          SECRETS: ${{ needs.secrets.result }}
          TESTS: ${{ needs.tests.result }}
          COVERAGE: ${{ needs.coverage.result }}
          README_SMOKE: ${{ needs.readme-smoke.result }}
          EXE: ${{ needs.exe.result }}
        run: |
          echo "checks: $CHECKS, secrets: $SECRETS, tests: $TESTS, coverage: $COVERAGE, readme-smoke: $README_SMOKE, exe: $EXE"
          test "$CHECKS" = success
          test "$SECRETS" = success
          test "$TESTS" = success
          test "$COVERAGE" = success
          test "$README_SMOKE" = success
          test "$EXE" = success
