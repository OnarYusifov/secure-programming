name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older, now pointless runs.
# Runs on main always finish, so every commit there gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash runs with -e and pipefail, so any failing command fails the step.
# The Windows default (PowerShell) only checks the last command's exit code.
defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -q -r src

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the latest one
          persist-credentials: false

      # The binary is checked against a hash written here, not against the
      # checksum file of the same release, so a swapped download fails.
      - name: Install gitleaks (version and SHA-256 pinned)
        working-directory: ${{ runner.temp }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --redact keeps any secret found out of the public CI log.
      - name: Secret scan (gitleaks, full history)
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      # On each OS, because code under `sys.platform == "win32"` is only
      # type-checked on that platform.
      - name: Type-check (mypy)
        run: mypy

      - name: Tests with coverage (pytest, at least 80%)
        run: pytest -q --cov

  # The one check that branch protection on main requires. Matrix entries
  # and new jobs can change without touching the protection rule; they
  # only need to be listed here.
  ci-ok:
    if: always()
    needs: [checks, secrets, tests]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          CHECKS: ${{ needs.checks.result }}
          SECRETS: ${{ needs.secrets.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "checks: $CHECKS, secrets: $SECRETS, tests: $TESTS"
          test "$CHECKS" = success
          test "$SECRETS" = success
          test "$TESTS" = success
