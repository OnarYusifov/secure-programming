[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yunarpass"
version = "0.0.1"
description = "A local, multi-user password manager for the terminal (ICS0022 project)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
yunarpass = "yunarpass.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "PTH"]
# S101: assert is fine in tests
per-file-ignores = { "tests/*" = ["S101"] }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
