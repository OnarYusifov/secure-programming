[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yunarpass"
version = "0.0.1"
description = "A local, multi-user password manager for the terminal (ICS0022 project)"
requires-python = ">=3.12"
# Minimum versions only; the exact, hash-checked versions are in requirements.txt.
dependencies = [
    "cryptography>=44",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
yunarpass = "yunarpass.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "PTH"]
# Tests: assert is fine (S101), and fixtures use throwaway passwords (S105, S106)
per-file-ignores = { "tests/*" = ["S101", "S105", "S106"] }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["yunarpass"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
